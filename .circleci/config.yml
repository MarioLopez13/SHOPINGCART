version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout
      - run:
          name: Compilar proyecto
          command: mvn clean compile

  test:
    docker:
      - image: cimg/openjdk:17.0
    parallelism: 2
    steps:
      - checkout
      - run:
          name: Ejecutar pruebas en paralelo
          command: mvn test

  quality:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout
      - run:
          name: Validar proyecto Maven
          command: mvn validate

  package:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout
      - run:
          name: Empaquetar aplicación
          command: mvn package -DskipTests

workflows:
  validacion:
    jobs:
      - build
      - test:
          requires:
            - build
      - quality:
          requires:
            - build

  entrega:
    jobs:
      - package:
          requires:
            - test
            - quality