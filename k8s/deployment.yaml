apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingcart-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shoppingcart
  template:
    metadata:
      labels:
        app: shoppingcart
    spec:
      containers:
        - name: shoppingcart
          image: nginx:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80